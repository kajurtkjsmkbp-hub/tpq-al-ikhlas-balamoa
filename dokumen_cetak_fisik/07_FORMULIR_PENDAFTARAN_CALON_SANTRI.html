<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>FORMULIR PENDAFTARAN CALON SANTRI - TPQ MUSLIMAT NU AL-IKHLAS</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 10mm 15mm;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'Times New Roman', Times, serif;
      margin: 0;
      padding: 0;
      background: #f1f5f9;
      color: #0f172a;
      font-size: 10pt;
      line-height: 1.35;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .print-sheet {
      background: white;
      width: 210mm;
      min-height: 297mm;
      margin: 20px auto;
      padding: 12mm 15mm;
      box-sizing: border-box;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
      border-radius: 4px;
      page-break-after: always;
      break-after: page;
      position: relative;
    }
    @media print {
      body {
        background: white !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .print-sheet {
        width: 100% !important;
        max-width: 100% !important;
        min-height: auto !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
        page-break-after: avoid !important;
        break-after: avoid !important;
      }
      .no-print {
        display: none !important;
      }
    }
    .kop {
      border-bottom: 3px double #064e3b;
      padding-bottom: 6px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .kop-logo {
      width: 60px;
      height: 60px;
      border: 1.5px solid #064e3b;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20pt;
      background: #ecfdf5;
      color: #047857;
      flex-shrink: 0;
      text-align: center;
    }
    .kop-mid {
      text-align: center;
      flex: 1;
    }
    .kop-mid h4 {
      margin: 0;
      font-size: 9pt;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #064e3b;
      font-weight: bold;
    }
    .kop-mid h2 {
      margin: 2px 0;
      font-size: 13.5pt;
      font-weight: 900;
      color: #064e3b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kop-mid p {
      margin: 1px 0;
      font-size: 7.5pt;
      color: #334155;
    }
    .doc-title {
      text-align: center;
      margin: 6px 0 10px;
    }
    .doc-title h3 {
      margin: 0;
      text-decoration: underline;
      text-transform: uppercase;
      font-size: 11.5pt;
      font-weight: bold;
    }
    .doc-title h4 {
      margin: 2px 0 0;
      font-size: 9.5pt;
      font-weight: bold;
      text-transform: uppercase;
      color: #1e293b;
    }
    .doc-title p {
      margin: 2px 0 0;
      font-size: 8.5pt;
      font-weight: bold;
      color: #334155;
    }
    .section-title {
      font-size: 9pt;
      font-weight: bold;
      text-transform: uppercase;
      color: #0f172a;
      border-bottom: 1px solid #94a3b8;
      padding-bottom: 2px;
      margin: 8px 0 4px;
    }
    .form-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 9pt;
    }
    .form-table td {
      padding: 1.5px 0;
      vertical-align: top;
    }
    .col-num {
      width: 22px;
    }
    .col-label {
      width: 185px;
    }
    .col-colon {
      width: 12px;
      text-align: center;
    }
    .col-dots {
      border-bottom: 1px dotted #475569;
      min-height: 16px;
      padding-left: 4px;
      font-family: sans-serif;
      font-size: 8.5pt;
      color: #0f172a;
    }
    .req-box {
      margin-top: 8px;
      padding: 6px 10px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      font-size: 7.5pt;
      line-height: 1.35;
    }
    .photo-box {
      width: 75px;
      height: 105px;
      border: 1px dashed #475569;
      background: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 7.5pt;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- FLOATING TOOLBAR AKSI (NO-PRINT) -->
  <div class="no-print" style="position: fixed; top: 15px; right: 15px; z-index: 999; background: #064e3b; padding: 10px 16px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 10px;">
    <button onclick="window.print()" style="background: #fbbf24; color: #000; border: none; padding: 8px 16px; font-weight: bold; font-size: 11pt; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
      <span>🖨️ CETAK FORMULIR (Ctrl + P)</span>
    </button>
    <button onclick="toggleMode()" id="btn-toggle-mode" style="background: white; color: #064e3b; border: none; padding: 8px 14px; font-weight: bold; font-size: 9pt; border-radius: 8px; cursor: pointer;">
      Mode: Blanko Titik-Titik
    </button>
    <button onclick="toggleKop()" id="btn-toggle-kop" style="background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 8px 14px; font-weight: bold; font-size: 9pt; border-radius: 8px; cursor: pointer;">
      Kop: Berlogo Resmi
    </button>
    <a href="../index.html" style="background: rgba(255,255,255,0.15); color: #fff; text-decoration: none; padding: 8px 12px; font-size: 9pt; border-radius: 8px; font-weight: 600;">
      ⬅ Kembali ke Aplikasi
    </a>
  </div>

  <!-- CONTAINER PRINT SHEET A4 -->
  <div class="print-sheet" id="print-sheet-content">
    <!-- Konten di-generate secara dinamis oleh script -->
  </div>

  <script src="../js/store.js"></script>
  <script src="../js/full_documents.js"></script>
  <script>
    let currentMode = 'blank'; // 'blank' | 'filled'
    let currentUseKop = true;

    function loadContent() {
      const store = (typeof getAppStore === 'function') ? getAppStore() : DEFAULT_STORE;
      const cfg = store.formulirConfig || DEFAULT_STORE.formulirConfig;
      const inst = store.institution || DEFAULT_STORE.institution;
      const santri = (store.santri && store.santri.length > 0) ? store.santri[0] : null;

      let html = '';

      // 1. KOP SURAT / HEADER
      if (currentUseKop && cfg.useKop !== false) {
        html += `
          <div class="kop">
            <div class="kop-logo">📖</div>
            <div class="kop-mid">
              <h4>${inst.foundation || 'YAYASAN AL FATAH'}</h4>
              <h2>${inst.name || 'TPQ MUSLIMAT NU AL-IKHLAS'}</h2>
              <p>Badan Hukum: ${inst.notary || 'AHU-0014285.AH.01.04.Tahun 2018'} • NSQ: ${inst.nsq || '411235150089'} • SK IJOP: ${inst.ijop || 'Kd.13.15/4/PP.00.7/1420/2024'}</p>
              <p>Alamat: ${inst.address || 'Jl. Masjid Al-Fatah No. 09'}, ${inst.village || 'Sidokare'}, Kec. ${inst.subdistrict || 'Sidoarjo'}, ${inst.city || 'Kab. Sidoarjo'} | Telp: ${inst.phone || '0812-3245-8891'}</p>
            </div>
            <div class="kop-logo" style="font-size: 8pt; line-height: 1.1; font-weight: bold; background: #064e3b; color: #fbbf24;">MUSLIMAT<br>NU</div>
          </div>
          <div class="doc-title">
            <h3>${cfg.title || 'FORMULIR PENDAFTARAN'}</h3>
            <h4>${cfg.subtitle || 'CALON PESERTA DIDIK TPQ MUSLIMAT NU AL-IKHLAS'}${cfg.branchTag ? ' ' + cfg.branchTag : ''}</h4>
            <p>TAHUN AJARAN ${cfg.academicYear || '2026/2027'}</p>
          </div>
        `;
      } else {
        html += `
          <div class="doc-title" style="border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 12px;">
            <h3 style="font-size: 13pt;">${cfg.title || 'FORMULIR PENDAFTARAN'}</h3>
            <h4 style="font-size: 10.5pt; margin-top: 4px;">${cfg.subtitle || 'CALON PESERTA DIDIK TPQ MUSLIMAT NU AL-IKHLAS'}${cfg.branchTag ? ' ' + cfg.branchTag : ''}</h4>
            <p style="font-size: 9.5pt; margin-top: 4px;">TAHUN AJARAN ${cfg.academicYear || '2026/2027'}</p>
          </div>
        `;
      }

      // 2. IDENTITAS CALON PESERTA DIDIK
      const isFilled = (currentMode === 'filled');
      const getVal = (fieldId) => {
        if (!isFilled || !santri) return '&nbsp;';
        switch (fieldId) {
          case 'name': return santri.name || '';
          case 'nickname': return santri.nickname || santri.name.split(' ')[0];
          case 'birthPlaceDate': return (santri.birthPlace ? santri.birthPlace + ', ' : '') + (santri.birthDate || '');
          case 'gender': return santri.gender === 'L' ? 'Laki-laki (L)' : 'Perempuan (P)';
          case 'religion': return 'Islam';
          case 'childOrder': return '1';
          case 'siblingCount': return '2';
          case 'familyStatus': return 'Anak Kandung';
          case 'citizenship': return 'WNI';
          case 'address': return santri.address || '';
          case 'phone': return santri.parentPhone || '';
          default: return '';
        }
      };

      const getFatherVal = (fieldId) => {
        if (!isFilled || !santri) return '&nbsp;';
        switch (fieldId) {
          case 'name': return santri.parentName || '';
          case 'religion': return 'Islam';
          case 'citizenship': return 'WNI';
          case 'phone': return santri.parentPhone || '';
          default: return '';
        }
      };

      const studentFields = (cfg.studentFields || []).filter(f => f.enabled !== false);
      const studentRows = studentFields.map((f, i) => `
        <tr>
          <td class="col-num">${i + 1}.</td>
          <td class="col-label">${f.label}</td>
          <td class="col-colon">:</td>
          <td class="col-dots">${getVal(f.id)}</td>
        </tr>
      `).join('');

      html += `
        <div class="section-title">${cfg.studentSectionTitle || 'IDENTITAS CALON PESERTA DIDIK'}</div>
        <table class="form-table">
          ${studentRows}
        </table>
      `;

      // 3. IDENTITAS ORANG TUA / WALI
      const fatherFields = (cfg.fatherFields || []).filter(f => f.enabled !== false);
      const fatherRows = fatherFields.map((f, i) => `
        <tr>
          <td class="col-num" style="padding-left: 10px;">${String.fromCharCode(97 + i)}.</td>
          <td class="col-label">${f.label}</td>
          <td class="col-colon">:</td>
          <td class="col-dots">${getFatherVal(f.id)}</td>
        </tr>
      `).join('');

      const motherFields = (cfg.motherFields || []).filter(f => f.enabled !== false);
      const motherRows = motherFields.map((f, i) => `
        <tr>
          <td class="col-num" style="padding-left: 10px;">${String.fromCharCode(97 + i)}.</td>
          <td class="col-label">${f.label}</td>
          <td class="col-colon">:</td>
          <td class="col-dots">&nbsp;</td>
        </tr>
      `).join('');

      html += `
        <div class="section-title" style="margin-top: 10px;">${cfg.parentSectionTitle || 'IDENTITAS ORANG TUA/WALI'}</div>
        <table class="form-table">
          <tr>
            <td class="col-num" style="font-weight: bold;">1.</td>
            <td colspan="3" style="font-weight: bold;">${cfg.fatherHeader || 'Ayah kandung/tiri/angkat/wali *)'}</td>
          </tr>
          ${fatherRows}
          <tr>
            <td class="col-num" style="font-weight: bold; padding-top: 4px;">2.</td>
            <td colspan="3" style="font-weight: bold; padding-top: 4px;">${cfg.motherHeader || 'Ibu kandung/tiri/angkat/wali *)'}</td>
          </tr>
          ${motherRows}
        </table>
      `;

      // 4. PERSYARATAN BERKAS
      if (cfg.showRequirements !== false && cfg.requirementsText) {
        const reqLines = cfg.requirementsText.split('\n').filter(l => l.trim().length > 0);
        html += `
          <div class="req-box">
            <strong style="text-transform: uppercase;">${cfg.requirementsTitle || 'Syarat-Syarat Berkas Pendaftaran:'}</strong>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; margin-top: 3px;">
              ${reqLines.map(l => `<div>${l}</div>`).join('')}
            </div>
          </div>
        `;
      }

      // 5. PENGESAHAN & TANDA TANGAN
      const signCity = cfg.signCity || inst.legalCity || 'Sidoarjo';
      let dateText = '................................ 20...';
      if (cfg.signDateMode === 'today' || (isFilled && !cfg.signCustomDate)) {
        dateText = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
      } else if (cfg.signCustomDate) {
        dateText = cfg.signCustomDate;
      }

      html += `
        <div style="margin-top: 14px; padding-top: 8px; border-top: 1px solid #cbd5e1;">
          <table style="width: 100%; border: none; font-size: 8.5pt;">
            <tr>
              <!-- Panitia -->
              <td style="width: 38%; text-align: center; vertical-align: top;">
                <p style="margin: 0;">Mengetahui / Menerima,</p>
                <p style="margin: 2px 0 0; font-weight: bold;">${cfg.officerSignTitle || 'Panitia Penerimaan Santri'}</p>
                <div style="height: 55px; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 7.5pt; font-style: italic;">
                  ( Tanda Tangan & Stempel )
                </div>
                <p style="margin: 0; font-weight: bold; text-decoration: underline;">${cfg.officerName || inst.headmaster}</p>
                <p style="margin: 1px 0 0; font-size: 7pt; font-family: monospace; color: #475569;">${inst.headmasterNip || ''}</p>
              </td>

              <!-- Pas Foto 3x4 -->
              <td style="width: 24%; text-align: center; vertical-align: middle;">
                ${cfg.showPhotoBox !== false ? `
                  <div style="display: flex; justify-content: center;">
                    <div class="photo-box">
                      <span>Pas Foto</span>
                      <strong style="font-size: 9pt; color: #1e293b; margin-top: 2px;">3 x 4</strong>
                    </div>
                  </div>
                ` : ''}
              </td>

              <!-- Orang Tua / Wali -->
              <td style="width: 38%; text-align: center; vertical-align: top;">
                <p style="margin: 0;">${signCity}, ${dateText}</p>
                <p style="margin: 2px 0 0; font-weight: bold;">${cfg.parentSignTitle || 'Orang Tua / Wali Calon Santri'}</p>
                <div style="height: 55px; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 7.5pt; font-style: italic;">
                  ( Tanda Tangan Terang )
                </div>
                <p style="margin: 0; font-weight: bold;">( .................................................... )</p>
                ${isFilled && santri ? `<p style="margin: 1px 0 0; font-size: 7.5pt; color: #475569;">Wali dari: ${santri.name}</p>` : ''}
              </td>
            </tr>
          </table>

          <div style="margin-top: 6px; font-size: 7pt; font-style: italic; color: #64748b;">
            ${cfg.footerNote || '*) Coret yang tidak perlu'}
          </div>
        </div>
      `;

      document.getElementById('print-sheet-content').innerHTML = html;
    }

    function toggleMode() {
      currentMode = (currentMode === 'blank') ? 'filled' : 'blank';
      document.getElementById('btn-toggle-mode').innerText = (currentMode === 'blank') ? 'Mode: Blanko Titik-Titik' : 'Mode: Terisi Contoh Santri';
      loadContent();
    }

    function toggleKop() {
      currentUseKop = !currentUseKop;
      document.getElementById('btn-toggle-kop').innerText = currentUseKop ? 'Kop: Berlogo Resmi' : 'Kop: Judul Teks Polos';
      loadContent();
    }

    // Inisialisasi awal
    window.onload = loadContent;
  </script>
</body>
</html>
